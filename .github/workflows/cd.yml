name: CD

on:
  pull_request:
    branches: [deploy]
    types: [closed]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/ci.yml'

env:
  REGISTRY: ${{ secrets.REGISTRY_URL_ECR }}
  IMAGE_NAME: ktb-personal
  IMAGE_PREFIX: be
  AWS_REGION: ap-northeast-2

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew
      - run: ./gradlew build test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event.pull_request.merged == true
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Generate tag
        id: tag
        run: echo "TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_PREFIX }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_PREFIX }}-${{ steps.tag.outputs.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.merged == true
    steps:
      - name: Trigger Jenkins backend deploy
        env:
          IMAGE_DATE_TAG: ${{ needs.build.outputs.image_tag }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}            # Jenkins 계정 ID
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}  # Jenkins API 토큰
        run: |
          echo "Trigger Jenkins backend deploy with IMAGE_DATE_TAG=${IMAGE_DATE_TAG}"

          # 1) Crumb 발급
          CRUMB_JSON=$(curl -s -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" "${JENKINS_URL}/crumbIssuer/api/json")
          echo "CRUMB_JSON=${CRUMB_JSON}"

          CRUMB_FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')
          CRUMB=$(echo "$CRUMB_JSON" | jq -r '.crumb')

          echo "Got crumb: ${CRUMB_FIELD}:${CRUMB}"

          # 2) Jenkins 잡 파라미터 빌드 트리거
          curl -X POST "${JENKINS_URL}/job/community-backend-deploy/buildWithParameters" \
               -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
               -H "${CRUMB_FIELD}: ${CRUMB}" \
               --data-urlencode "IMAGE_DATE_TAG=${IMAGE_DATE_TAG}"
